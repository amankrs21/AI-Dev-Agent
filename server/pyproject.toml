[project]
name = "server"
version = "3.1.0"
description = "AI DEV Agent backend fastapi application"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.127.1",
    "httpx>=0.27.0",
    "langchain-core>=1.2.5",
    "langchain-huggingface>=1.2.0",
    "langchain-mistralai>=1.1.1",
    "langgraph>=1.0.5",
    "langsmith>=0.5.1",
    "mangum>=0.19.0",
    "motor>=3.7.1",
    "orjson>=3.11.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "pymongo>=4.15.5",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "uvicorn>=0.40.0",
]
